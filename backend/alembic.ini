# A generic Alembic configuration file.
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts
script_location = alembic

# Template for new migration file names
# e.g. "%%(rev)s_%%(slug)s"
# file_template = %%(rev)s_%%(slug)s

# Set to 'true' to allow .pyc files to be generated
# pyc_imports = false

# The "revision_environment" setting will cause Alembic to
# import the alembic/env.py file specifically using the "run_in_process"
# runner, bypassing the "alembic" script itself, which is necessary
# for environment tools like Pycharm to be able to run migrations
# directly.
revision_environment = true

# Sets the migration file-naming template for autogenerate
# revision_environment = true
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# Hooks are scripts or modules that run after Alembic writes a migration script.
# (e.g., code formatters like ruff or black)
hooks = ruff
ruff.type = ruff
ruff.bin = "ruff format"
ruff.options = alembic/versions/

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
